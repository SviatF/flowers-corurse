name: Migrate site to static local HTML

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_static_site.py'
      - 'public/assets/hero-wordmark.svg'
      - '.github/workflows/migrate-static-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Bake all florist changes directly into HTML
        run: python scripts/migrate_static_site.py

      - name: Replace runtime proxy with a local-file response
        run: |
          cat > app/route.ts <<'TS'
          import { readFile } from "node:fs/promises";
          import path from "node:path";

          const SITE_HTML = path.join(
            process.cwd(),
            "public",
            "snapshot",
            "reference.html",
          );

          export async function GET() {
            try {
              const html = await readFile(SITE_HTML, "utf8");
              return new Response(html, {
                status: 200,
                headers: {
                  "content-type": "text/html; charset=utf-8",
                  "cache-control": "no-store, max-age=0",
                  "x-site-source": "local-static-html",
                },
              });
            } catch (error) {
              console.error("Unable to serve local site HTML", error);
              return new Response("Local site unavailable", { status: 500 });
            }
          }
          TS

      - name: Remove all custom client-side override scripts
        run: |
          rm -f \
            public/floral-image-overrides.js \
            public/floral-copy-core.js \
            public/floral-copy-results.js \
            public/floral-copy-footer.js \
            public/floral-programs-nav.js \
            public/floral-hero-title.js \
            public/floral-course-cleanup.js

      - name: Verify architecture
        run: |
          set -euo pipefail
          ! grep -R "fetch(.*danmall.com\|SOURCE_ORIGIN.*danmall.com\|floral-hero-title.js\|floral-copy-core.js" app public/snapshot/reference.html
          grep -q '/assets/hero-wordmark.svg' public/snapshot/reference.html
          grep -q '/hero-florist' public/snapshot/reference.html
          grep -q 'ГРОШІ НА КВІТАХ' public/snapshot/reference.html
          grep -q 'Флорист від нуля до результату' public/snapshot/reference.html
          grep -q '2999 €' public/snapshot/reference.html

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Bake course site directly into local HTML'
          git push origin HEAD:main
