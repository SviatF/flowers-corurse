name: Build fully local site mirror

on:
  push:
    branches: [local-full-mirror]
    paths:
      - 'scripts/build_local_mirror.py'
      - '.github/workflows/build-local-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror branch
        uses: actions/checkout@v4
        with:
          ref: local-full-mirror
          fetch-depth: 0

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Build local HTML and mirror external runtime assets
        id: build
        continue-on-error: true
        run: python scripts/build_local_mirror.py

      - name: Commit generated local mirror and report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/local-site
          if git diff --cached --quiet; then
            echo 'No generated mirror changes.'
          else
            git commit -m 'Generate fully local Framer mirror'
            git push origin HEAD:local-full-mirror
          fi

      - name: Fail if dependency audit failed
        if: steps.build.outcome == 'failure'
        run: |
          echo 'Mirror build reported unresolved runtime dependencies. Inspect public/local-site/BUILD_REPORT.txt.'
          exit 1
