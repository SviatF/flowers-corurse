name: Inspect hero markup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect local snapshot hero text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('public/snapshot/reference.html')
          html = p.read_text(encoding='utf-8')
          out = []

          patterns = [
              r'(?i)>(?:\s|&nbsp;)*(dan|mall)(?:\s|&nbsp;)*<',
              r'(?i)dan',
              r'(?i)mall',
          ]

          seen = set()
          for pattern in patterns:
              for m in re.finditer(pattern, html):
                  start = max(0, m.start() - 900)
                  end = min(len(html), m.end() + 900)
                  chunk = html[start:end]
                  key = (start, end)
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(f'--- MATCH {m.group(0)!r} @ {m.start()} ---\n{chunk}\n')
                  if len(out) >= 40:
                      break
              if len(out) >= 40:
                  break

          Path('public/snapshot/HERO_MATCHES.txt').write_text('\n'.join(out), encoding='utf-8')
          print(f'Wrote {len(out)} matches')
          PY
      - name: Commit hero inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/snapshot/HERO_MATCHES.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect exact hero markup'
          git push origin HEAD:main
