name: Final local-site cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-source-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove source branding from local HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/snapshot/reference.html')
          text = path.read_text(encoding='utf-8')

          text = re.sub(r'<!--\s*Made in Framer.*?-->', '', text, flags=re.I | re.S)
          text = re.sub(r'<!--\s*Published .*?-->', '', text, flags=re.I | re.S)
          text = re.sub(r'<meta[^>]+name=["\']generator["\'][^>]*>', '', text, flags=re.I)

          replacements = {
              'Dan Mall Helps Designers Make More Money &amp; Get Their Flowers': 'ГРОШІ НА КВІТАХ — курси флористики та квіткового бізнесу',
              'Dan Mall Helps Designers Make More Money & Get Their Flowers': 'ГРОШІ НА КВІТАХ — курси флористики та квіткового бізнесу',
              'I help designers make more money and get their flowers through better pricing, leadership, and a career you love. 28 years of lessons. Join 70k+ readers.': 'Курси флористики: професійна база, квітковий бізнес та VIP-наставництво.',
              'Dan Mall': 'ГРОШІ НА КВІТАХ',
              'danmall': 'floral-education',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify final local architecture
        run: |
          set -euo pipefail
          ! grep -E -q 'danmall\.com|framerusercontent\.com|fonts\.gstatic\.com|fonts\.googleapis\.com|events\.framer\.com' public/snapshot/reference.html
          ! grep -q 'Dan Mall' public/snapshot/reference.html
          ! grep -q 'Made in Framer' public/snapshot/reference.html
          grep -q 'ГРОШІ НА КВІТАХ' public/snapshot/reference.html
          grep -q 'Флорист від нуля до результату' public/snapshot/reference.html
          grep -q 'Флористичний бізнес від А до Я' public/snapshot/reference.html
          grep -q '2999 €' public/snapshot/reference.html
          test -d public/vendor/framer
          test -d public/vendor/fonts

      - name: Commit final cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/snapshot/reference.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove source branding from local course site'
          git push origin HEAD:main
