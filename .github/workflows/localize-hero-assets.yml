name: Localize hero flower assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-hero-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact moving flower layers
        run: |
          set -euo pipefail
          mkdir -p public/assets/flowers
          curl --fail --location --retry 3 \
            'https://framerusercontent.com/images/BZcrpXuxs1Fhqa1qlhbe2HKEPIQ.webp' \
            -o public/assets/flowers/pink-orchid-layer.webp
          curl --fail --location --retry 3 \
            'https://framerusercontent.com/images/Vj2sUVeKh69wBm6eGZIvVWtEDo.webp' \
            -o public/assets/flowers/white-magnolia-layer.webp
          test -s public/assets/flowers/pink-orchid-layer.webp
          test -s public/assets/flowers/white-magnolia-layer.webp

      - name: Rewrite hero assets in HTML and hydration payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/snapshot/reference.html')
          html = path.read_text(encoding='utf-8')

          replacements = [
              (
                  r'https://framerusercontent\.com/images/BZcrpXuxs1Fhqa1qlhbe2HKEPIQ\.webp(?:\?[^\s\"\'<>)]*)?',
                  '/assets/flowers/pink-orchid-layer.webp',
              ),
              (
                  r'https://framerusercontent\.com/images/Vj2sUVeKh69wBm6eGZIvVWtEDo\.webp(?:\?[^\s\"\'<>)]*)?',
                  '/assets/flowers/white-magnolia-layer.webp',
              ),
              (
                  r'https://framerusercontent\.com/images/nT1RIIaymTzAI6UESI2yEzrKinU\.png(?:\?[^\s\"\'<>)]*)?',
                  '/assets/hero-wordmark.svg',
              ),
              (
                  r'https://framerusercontent\.com/images/hIvMq00Eiq5eJzxlzt69EooL6Cg\.jpg(?:\?[^\s\"\'<>)]*)?',
                  '/hero-florist',
              ),
          ]

          for pattern, replacement in replacements:
              html = re.sub(pattern, replacement, html, flags=re.I)

          # Handle saveweb-style paths too, if any remained in serialized payloads.
          for old, new in {
              'images/BZcrpXuxs1Fhqa1qlhbe2HKEPIQ.webp': '/assets/flowers/pink-orchid-layer.webp',
              'images/Vj2sUVeKh69wBm6eGZIvVWtEDo.webp': '/assets/flowers/white-magnolia-layer.webp',
              'images/nT1RIIaymTzAI6UESI2yEzrKinU.png': '/assets/hero-wordmark.svg',
              'images/hIvMq00Eiq5eJzxlzt69EooL6Cg.jpg': '/hero-florist',
          }.items():
              html = html.replace(old, new)

          html = html.replace('data-framer-name="Dan Mall"', 'data-framer-name="ГРОШІ НА КВІТАХ"')
          html = html.replace('data-framer-name="Danmal Image"', 'data-framer-name="Hero Floral Image"')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify hero is local
        run: |
          set -euo pipefail
          grep -q '/assets/flowers/pink-orchid-layer.webp' public/snapshot/reference.html
          grep -q '/assets/flowers/white-magnolia-layer.webp' public/snapshot/reference.html
          grep -q '/assets/hero-wordmark.svg' public/snapshot/reference.html
          grep -q '/hero-florist' public/snapshot/reference.html
          ! grep -q 'BZcrpXuxs1Fhqa1qlhbe2HKEPIQ' public/snapshot/reference.html
          ! grep -q 'Vj2sUVeKh69wBm6eGZIvVWtEDo' public/snapshot/reference.html
          ! grep -q 'nT1RIIaymTzAI6UESI2yEzrKinU' public/snapshot/reference.html
          ! grep -q 'hIvMq00Eiq5eJzxlzt69EooL6Cg' public/snapshot/reference.html

      - name: Commit local hero
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/flowers public/snapshot/reference.html
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Make hero flowers and title fully local'
          git push origin HEAD:main
