name: Self-host all runtime assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/selfhost_runtime.py'
      - '.github/workflows/selfhost-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Mirror Framer runtime, fonts and media locally
        run: |
          set +e
          python scripts/selfhost_runtime.py > public/snapshot/SELFHOST_LOG.txt 2>&1
          code=$?
          echo "$code" > public/snapshot/SELFHOST_EXIT_CODE.txt
          cat public/snapshot/SELFHOST_LOG.txt
          exit 0

      - name: Commit build output or diagnostics
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add public/snapshot/SELFHOST_LOG.txt public/snapshot/SELFHOST_EXIT_CODE.txt
          [ -f public/snapshot/SELFHOST_REPORT.txt ] && git add public/snapshot/SELFHOST_REPORT.txt || true
          [ -f public/snapshot/reference.html ] && git add public/snapshot/reference.html || true
          [ -d public/vendor ] && git add -A public/vendor || true

          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi

          if [ "$(cat public/snapshot/SELFHOST_EXIT_CODE.txt)" = "0" ]; then
            git commit -m 'Self-host complete Framer runtime and hero assets'
          else
            git commit -m 'Capture self-host runtime build diagnostics'
          fi
          git push origin HEAD:main

      - name: Verify successful fully local build
        run: |
          set -euo pipefail
          test "$(cat public/snapshot/SELFHOST_EXIT_CODE.txt)" = "0"
          test ! -e public/floral-hero-title.js
          test ! -e public/floral-image-overrides.js
          test ! -e public/floral-copy-core.js
          test ! -e public/floral-copy-results.js
          test ! -e public/floral-copy-footer.js
          test ! -e public/floral-programs-nav.js
          test ! -e public/floral-course-cleanup.js
          ! grep -R -E 'danmall\.com|framerusercontent\.com|fonts\.gstatic\.com|events\.framer\.com' public/snapshot/reference.html
          grep -q '/assets/hero-wordmark.svg' public/snapshot/reference.html
          grep -q '/hero-florist' public/snapshot/reference.html
          grep -q 'ГРОШІ НА КВІТАХ' public/snapshot/reference.html
          test -s public/snapshot/SELFHOST_REPORT.txt
          test -d public/vendor/framerusercontent.com
