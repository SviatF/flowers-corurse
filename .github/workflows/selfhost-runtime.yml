name: Self-host all runtime assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/selfhost_runtime.py'
      - '.github/workflows/selfhost-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Mirror Framer runtime, fonts and media locally
        run: python scripts/selfhost_runtime.py

      - name: Verify no client override layer remains
        run: |
          set -euo pipefail
          test ! -e public/floral-hero-title.js
          test ! -e public/floral-image-overrides.js
          test ! -e public/floral-copy-core.js
          test ! -e public/floral-copy-results.js
          test ! -e public/floral-copy-footer.js
          test ! -e public/floral-programs-nav.js
          test ! -e public/floral-course-cleanup.js
          ! grep -R -E 'danmall\.com|framerusercontent\.com|fonts\.gstatic\.com|events\.framer\.com' public/snapshot/reference.html
          grep -q '/assets/hero-wordmark.svg' public/snapshot/reference.html
          grep -q '/hero-florist' public/snapshot/reference.html
          grep -q 'ГРОШІ НА КВІТАХ' public/snapshot/reference.html
          test -s public/snapshot/SELFHOST_REPORT.txt
          test -d public/vendor/framerusercontent.com

      - name: Commit fully self-hosted runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/snapshot/reference.html public/snapshot/SELFHOST_REPORT.txt public/vendor
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Self-host complete Framer runtime and hero assets'
          git push origin HEAD:main
